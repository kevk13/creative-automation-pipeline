services:
  app:
    build: .
    ports:
      - "4000:4000"
      - "5173:5173"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
      DROPBOX_ACCESS_TOKEN: ${DROPBOX_ACCESS_TOKEN:-}
    volumes:
      - ./artifacts/api-server/output:/app/artifacts/api-server/output
      - ./artifacts/api-server/logs:/app/artifacts/api-server/logs
